name: Approve gallery photo

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  import:
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/approve-gallery') &&
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import approved attachment(s)
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/import-gallery-issue.py

      - name: Commit gallery images
        run: |
          git config user.name "that-time-again-gallery-bot"
          git config user.email "gallery-bot@users.noreply.github.com"
          git add public/gallery
          if git diff --cached --quiet; then
            echo "No gallery files were imported."
            exit 1
          fi
          git commit -m "gallery: import issue #${{ github.event.issue.number }}"
          git push

      - name: Confirm and close submission
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Approved and added to the gallery. It is now available to the website.'
            })
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })
